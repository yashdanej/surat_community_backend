services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: backend

    restart: unless-stopped

    ports:
      - "${PORT}:${PORT}"

    env_file:
      - .env

    depends_on:
      - redis

    volumes:
      - ./logs:/app/logs

  redis:
    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

volumes:
  redis_data: